name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - run: uv sync --locked --python 3.12 --extra mcp
      - run: uv run --locked --extra mcp pytest -q

  desktop:
    name: Docker desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CI_BRIDGE_TOKEN: ci-smoke-only-bridge-token-12345
      CI_MCP_TOKEN: ci-mcp-smoke-only-token-12345678
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the native image
        run: docker build -f docker/Dockerfile -t agent-accessible-wechat:ci .
      - name: Start a private desktop with MCP enabled
        run: |
          sed 's/^mcp_enabled: false/mcp_enabled: true/' config.yaml > "$RUNNER_TEMP/wechat-bridge-ci.yaml"
          chmod 644 "$RUNNER_TEMP/wechat-bridge-ci.yaml"
          docker run --detach --name aaw-ci --network none --cap-drop ALL \
            --security-opt no-new-privileges:true --shm-size 256m \
            -e "BRIDGE_TOKEN=$CI_BRIDGE_TOKEN" -e VNC_PASSWORD=smoke123 \
            -e "MCP_TOKEN=$CI_MCP_TOKEN" \
            -v "$RUNNER_TEMP/wechat-bridge-ci.yaml:/app/config.yaml:ro" \
            agent-accessible-wechat:ci
      - name: Verify the WeChat package, Bridge API, noVNC and AT-SPI
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          expected=$(docker exec aaw-ci dpkg-query -W -f='${Architecture}' wechat)
          test "$expected" = "$EXPECTED_ARCH"
          for attempt in {1..45}; do
            test "$(docker inspect --format '{{.State.Running}}' aaw-ci)" = true
            if docker exec aaw-ci curl -fsS --max-time 2 http://127.0.0.1:8765/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec aaw-ci curl -fsS http://127.0.0.1:8765/health
          docker exec aaw-ci curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null
          code=$(docker exec aaw-ci curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/status)
          test "$code" = 401
          docker exec aaw-ci curl -fsS -H "Authorization: Bearer $CI_BRIDGE_TOKEN" \
            http://127.0.0.1:8765/status | python3 -c 'import json,sys; assert json.load(sys.stdin)["source"]["ready"] is False'
          for attempt in {1..30}; do
            if docker exec aaw-ci sh -c '. "$XDG_RUNTIME_DIR/bridge-session.env"; python -m tools.inspect_atspi --redact --max-nodes 15 --json -' \
              | python3 -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r["trees"] and not r["errors"] else 1)'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify the shared 78-tool catalog through HTTP and MCP
        run: |
          for attempt in {1..45}; do
            test "$(docker inspect --format '{{.State.Running}}' aaw-ci)" = true
            if docker exec aaw-ci curl -fsS --max-time 2 http://127.0.0.1:8765/wechat/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec aaw-ci curl -fsS http://127.0.0.1:8765/wechat/health
          docker exec aaw-ci curl -fsS http://127.0.0.1:8765/wechat/login >/dev/null
          code=$(docker exec aaw-ci curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/sessions)
          test "$code" = 401
          code=$(docker exec aaw-ci curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CI_BRIDGE_TOKEN" http://127.0.0.1:8765/sessions)
          test "$code" = 409
          code=$(docker exec aaw-ci curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/wechat/login/state)
          test "$code" = 401
          code=$(docker exec aaw-ci curl -sS -o /dev/null -w '%{http_code}' -H 'Host: example.test' http://127.0.0.1:8765/wechat/health)
          test "$code" = 403
          docker exec aaw-ci curl -fsS http://127.0.0.1:8765/tools \
            -H "Authorization: Bearer $CI_BRIDGE_TOKEN" > "$RUNNER_TEMP/wechat-http-tools.json"
          docker exec aaw-ci curl -fsS http://127.0.0.1:8765/mcp \
            -H "Authorization: Bearer $CI_MCP_TOKEN" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python3 -c 'import json,sys; tools=json.load(sys.stdin)["result"]["tools"]; http=json.load(open(sys.argv[1]))["tools"]; names={tool["name"] for tool in tools}; assert len(tools)==len(names)==len(http)==78 and {t["name"]:t["inputSchema"] for t in tools}=={t["name"]:t["inputSchema"] for t in http}; assert {"get_status","get_message","draft_message","get_configured_chat_messages","wechat_read_current_chat","wechat_status","wechat_send_file","wechat_ui_tree"} <= names' "$RUNNER_TEMP/wechat-http-tools.json"
      - name: Collect logs on failure
        if: failure()
        run: docker logs aaw-ci || true
      - name: Remove the isolated test container
        if: always()
        run: docker rm -f aaw-ci || true
