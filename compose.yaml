name: agent-accessible-wechat

services:
  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        WECHAT_ARM64_SHA256: ${WECHAT_ARM64_SHA256:-}
        WECHAT_AMD64_SHA256: ${WECHAT_AMD64_SHA256:-}
    environment:
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?Set BRIDGE_TOKEN in .env}
      MCP_TOKEN: ${MCP_TOKEN:-}
      VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
      BRIDGE_CONFIG: /app/config.yaml
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: 8765
      DISPLAY_RESOLUTION: ${DISPLAY_RESOLUTION:-1280x900x24}
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
      - "127.0.0.1:${BRIDGE_PORT:-8765}:8765"
    volumes:
      - wechat-home:/home/wechat
      - bridge-data:/data
      - type: bind
        source: ${BRIDGE_CONFIG_FILE:-./config.yaml}
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    restart: unless-stopped
    logging:
      driver: local
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  wechat-home:
  bridge-data:
